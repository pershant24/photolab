name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backstop for the local hooks, which cannot run on commits made with
  # --no-verify, in a clone where nobody set core.hooksPath, through the GitHub
  # web UI, in a squash merge (where the subject is composed in the merge dialog
  # and never passes through commit-msg), or server-side.
  #
  # This runs on push as well as pull_request precisely because those paths do
  # not involve a pull request at all.
  commit-messages:
    name: Commit messages and ref names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Load the forbidden pattern from the base branch
        env:
          # The branch a pull request targets, or the default branch on a push.
          # Not a literal "main", so a rename of the default branch or a pull
          # request against a long-lived branch does not silently read the wrong
          # file or fail to find one.
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Read the pattern from the base branch, never from the ref under test.
          # Reading it from the checked out ref would let a pull request that
          # edits the pattern file weaken the very check validating that pull
          # request. A pattern change therefore takes effect one merge after it
          # lands, validated against the previous version. That is intended.
          #
          # Deliberately not --depth=1: a shallow fetch grafts this repository's
          # history, which makes the previous push tip unreachable in the commit
          # message step. That defect silently degraded the range check to the
          # tip commit only on every push to the default branch.
          echo "Base ref: ${BASE_REF}"
          git fetch --no-tags origin "$BASE_REF"

          if ! git cat-file -e FETCH_HEAD:.githooks/forbidden-patterns.txt 2>/dev/null; then
            echo "::error::.githooks/forbidden-patterns.txt is missing on ${BASE_REF}; refusing to run unguarded."
            exit 1
          fi

          git show FETCH_HEAD:.githooks/forbidden-patterns.txt > "$RUNNER_TEMP/forbidden.txt"
          echo "Pattern in force (from ${BASE_REF}): $(cat "$RUNNER_TEMP/forbidden.txt")"

      - name: Check ref name
        env:
          # On a pull request github.ref_name is the synthetic "N/merge" ref, so
          # the contributor's branch name has to come from head_ref instead.
          REF_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          FORBIDDEN="$(cat "$RUNNER_TEMP/forbidden.txt")"

          if printf '%s' "$REF_NAME" | grep -qiE "$FORBIDDEN"; then
            echo "::error::Branch name references AI tooling: ${REF_NAME}"
            echo "Rename the branch to describe the work only."
            exit 1
          fi
          echo "Ref name clean: ${REF_NAME}"

      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          FORBIDDEN="$(cat "$RUNNER_TEMP/forbidden.txt")"
          ZERO=0000000000000000000000000000000000000000

          if [ "$EVENT" = pull_request ]; then
            revs="$(git rev-list "${PR_BASE}..${PR_HEAD}")"
            echo "Pull request: checking ${PR_BASE}..${PR_HEAD}"
          else
            after="${PUSH_AFTER:-}"
            if [ -z "$after" ] || [ "$after" = "$ZERO" ]; then
              after="$GITHUB_SHA"
            fi
            before="${PUSH_BEFORE:-}"

            # Three distinct conditions with three different correct responses.
            # They were previously collapsed into one fallback, which is how a
            # misconfigured fetch was able to masquerade as a force push and
            # silently reduce every range to a tip-only check.
            if [ -z "$before" ] || [ "$before" = "$ZERO" ]; then
              # Branch creation. There is no previous tip to range from.
              echo "Case: branch creation. Checking only ${after}."
              revs="$(git rev-list -n 1 "$after")"

            elif ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              # Not a fallback. With fetch-depth: 0 every reachable commit is
              # present, so a missing previous tip means the checkout or a fetch
              # in this job has shallowed the repository. Falling back here would
              # leave every commit below the tip unchecked while reporting green.
              echo "::error::Previous tip ${before} is not in the object store."
              echo "This is a configuration fault, not a force push. With fetch-depth: 0 the"
              echo "commit must be present, so either actions/checkout is not fetching full"
              echo "history or a --depth fetch in this job has grafted it."
              echo "Refusing to degrade to a tip-only check, which would silently leave the"
              echo "rest of this push unexamined."
              exit 1

            elif ! git merge-base --is-ancestor "$before" "$after" 2>/dev/null; then
              # Genuine force push: the previous tip is present but was rewritten
              # away, so ${before}..${after} is not a meaningful range.
              echo "Case: force push. ${before} is present but is not an ancestor of ${after}."
              echo "Checking only ${after}."
              revs="$(git rev-list -n 1 "$after")"

            else
              echo "Case: fast-forward push. Checking ${before}..${after}"
              echo "Note: commits already cleared on their pull request are re-checked here."
              echo "A failure on an apparently-green commit means it reached this branch unchecked."
              revs="$(git rev-list "${before}..${after}")"
            fi
          fi

          if [ -z "$revs" ]; then
            echo "No commits in range."
            exit 0
          fi

          failed=0
          count=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            count=$((count + 1))
            msg="$(git log -1 --format=%B "$sha")"
            if printf '%s' "$msg" | grep -qiE "$FORBIDDEN"; then
              subject="$(git log -1 --format='%s' "$sha")"
              echo "::error::Commit ${sha} references AI tooling or adds an attribution trailer: ${subject}"
              failed=1
            fi
          done <<< "$revs"

          if [ "$failed" -ne 0 ]; then
            echo "Rewrite the offending messages to describe the change only, then force-push."
          else
            echo "All ${count} commit message(s) clean."
          fi
          exit $failed

  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    # Skipped for pushes to non-default branches, where the pull_request event
    # already covers the same commits.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  golden:
    name: Golden and browser tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Reference images are generated with SwiftShader, so the browser version
      # is part of the expected output. Cache on the resolved Playwright version.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:golden

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
